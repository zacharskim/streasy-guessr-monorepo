services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/db/apartments.db:/app/db/apartments.db
      - ./backend/images:/app/images

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://rentgolf.infinite-monkey.biz/api
      network: host
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
